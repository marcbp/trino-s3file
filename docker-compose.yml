services:
  trino-coordinator:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: trino-s3file:latest
    ports:
      - "8080:8080"
    volumes:
      - ./docker/etc/config.properties:/etc/trino/config.properties:ro
      - ./docker/etc/node.properties:/etc/trino/node.properties:ro
      - ./docker/etc/exchange-manager.properties:/etc/trino/exchange-manager.properties:ro
    depends_on:
      - seaweedfs
    restart: unless-stopped

  trino-worker:
    image: trino-s3file:latest
    volumes:
      - ./docker/etc/worker:/etc/trino-worker:ro
      - ./docker/etc/exchange-manager.properties:/etc/trino/exchange-manager.properties:ro
    entrypoint: ["/etc/trino-worker/entrypoint.sh"]
    depends_on:
      - seaweedfs
      - trino-coordinator
    deploy:
      replicas: 2
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    environment:
      AWS_ACCESS_KEY_ID: s3file
      AWS_SECRET_ACCESS_KEY: s3file123
    command: mini -dir=/data -s3.port=9000
    ports:
      - "9000:9000"
    volumes:
      - seaweedfs-data:/data
    restart: unless-stopped

  tests:
    image: maven:3.9.16-eclipse-temurin-25
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven-repo:/root/.m2
    command: mvn test
    profiles:
      - tests

volumes:
  maven-repo:
  seaweedfs-data:
